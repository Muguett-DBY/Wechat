name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  parsing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q main.py parsing.py
