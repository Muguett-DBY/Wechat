name: Send WeChat Message
on:
  workflow_dispatch:
  schedule: 
    # 代表国际标准时间4点0分，北京时间需要+8小时，代表北京时间中午12点运行
    - cron: '05 00 * * *'
permissions:
  contents: read
jobs:
#将工作流程中运行的所有作业组合在一起
  build:
    if: vars.WECHAT_SEND_ENABLED == 'true'
  #定义名为 build 的作业。 子键将定义作业的属性 
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v7
    
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: install pip packages
        run: |
          python -m pip install --upgrade pip
          pip3 install -r requirements.txt
      - name: weixin
        env:
          WECHAT_CONFIG_JSON: ${{ secrets.WECHAT_CONFIG_JSON }}
        run: |
          python3 main.py
